# Optional: publish SPA to S3 + invalidate CloudFront.
# Disabled unless manually run with push_frontend=true and vars/secrets set.
# Prefer OIDC (AWS_ROLE_TO_ASSUME) over long-lived access keys.

name: Frontend static

on:
  workflow_dispatch:
    inputs:
      push_frontend:
        description: "Sync build to S3 and invalidate CloudFront"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: "true"
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'http://localhost:5000' }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.push_frontend }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync to S3 + invalidate CloudFront
        if: ${{ inputs.push_frontend }}
        env:
          BUCKET: ${{ vars.STATIC_FRONTEND_S3_BUCKET }}
          DIST_ID: ${{ vars.STATIC_FRONTEND_CF_DIST_ID }}
        run: |
          test -n "$BUCKET" || { echo "Set var STATIC_FRONTEND_S3_BUCKET"; exit 1; }
          test -n "$DIST_ID" || { echo "Set var STATIC_FRONTEND_CF_DIST_ID"; exit 1; }
          aws s3 sync build/ "s3://${BUCKET}/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
