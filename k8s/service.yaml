apiVersion: v1
kind: Service
metadata:
  name: anatomy-chatbot-api
  namespace: anatomy-chatbot
  labels:
    app.kubernetes.io/name: anatomy-chatbot
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anatomy-chatbot
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
