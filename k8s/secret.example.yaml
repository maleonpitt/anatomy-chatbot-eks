# EXAMPLE ONLY — do not commit real keys.
# Copy to a sealed/private channel or sync via External Secrets (see external-secret.example.yaml).
# kubectl apply of this file with REPLACE_ME values will not produce a working API.
apiVersion: v1
kind: Secret
metadata:
  name: anatomy-chatbot-api
  namespace: anatomy-chatbot
  labels:
    app.kubernetes.io/name: anatomy-chatbot
    app.kubernetes.io/component: api
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  PINECONE_API_KEY: "REPLACE_ME"
  SESSION_SECRET_KEY: "REPLACE_ME"
  # Prefer IRSA for AWS API access instead of static keys when possible.
  # AWS_ACCESS_KEY: "REPLACE_ME"
  # AWS_SECRET_KEY: "REPLACE_ME"
