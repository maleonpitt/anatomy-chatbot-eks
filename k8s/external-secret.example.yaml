# EXAMPLE — requires External Secrets Operator + AWS Secrets Manager + IRSA.
# Industry pattern: secret material lives in AWS; the cluster syncs it into a native Secret.
# https://external-secrets.io/
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: anatomy-chatbot
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: anatomy-chatbot-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anatomy-chatbot-api
  namespace: anatomy-chatbot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: anatomy-chatbot-api
    creationPolicy: Owner
  dataFrom:
    - extract:
        # JSON secret in Secrets Manager, keys matching env vars (OPENAI_API_KEY, etc.)
        key: anatomy-chatbot/backend
